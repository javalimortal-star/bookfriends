# Uptime alerts for https://bookfriends.com.br (plain-language guide:
# docs/MONITORING.md). When a scheduled run fails, GitHub emails you.
#  - "Site is up": every 15 minutes, /healthz must answer 200 with ok: true.
#  - "Backups are fresh": once a day, the mini PC's off-site copy and the
#    server's nightly backup must be under 36 hours old (one email a day
#    while they are not, instead of one every 15 minutes).
name: Uptime

on:
  schedule:
    # every 15 minutes, off the busy top of the hour (GitHub delays those runs)
    - cron: '4,19,34,49 * * * *'
    # 12:07 UTC = 09:07 in Brazil, hours after the mini PC's 04:00 download
    - cron: '7 12 * * *'
  # Actions tab -> Uptime -> Run workflow: runs both checks now
  workflow_dispatch:

# Only reads a public URL: the job token needs no access to the repo.
permissions: {}

env:
  HEALTH_URL: https://bookfriends.com.br/healthz

jobs:
  site:
    name: Site is up
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '4,19,34,49 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask /healthz (3 tries, 30 seconds apart)
        run: |
          for attempt in 1 2 3; do
            rm -f health.json
            code=$(curl -sS -o health.json -w '%{http_code}' --max-time 20 "$HEALTH_URL") || code=000
            if [ "$code" = 200 ] && jq -e '.ok == true' health.json > /dev/null 2>&1; then
              echo "BookFriends is up: $(cat health.json)"
              exit 0
            fi
            echo "Try $attempt of 3: HTTP $code $(cat health.json 2> /dev/null || true)"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo "::error title=BookFriends is down::$HEALTH_URL did not answer OK three times in a row. See docs/MONITORING.md."
          exit 1

  backups:
    name: Backups are fresh
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the off-site copy and the server backups
        run: |
          for attempt in 1 2 3; do
            rm -f health.json
            code=$(curl -sS -o health.json -w '%{http_code}' --max-time 20 "$HEALTH_URL") || code=000
            if jq -e '.offsite' health.json > /dev/null 2>&1; then break; fi
            echo "Try $attempt of 3: HTTP $code"
            if [ "$attempt" -lt 3 ]; then sleep 30; else
              echo "::error title=Could not check the backups::$HEALTH_URL did not answer. See docs/MONITORING.md."
              exit 1
            fi
          done
          offsite=$(jq -r '.offsite' health.json)
          backups=$(jq -r '.backups' health.json)
          echo "offsite: $offsite, backups: $backups"
          failed=0
          case "$offsite" in
            stale|never)
              echo "::error title=Off-site backup is old::The mini PC has not downloaded a backup in the last 36 hours (offsite: $offsite). Open the Users page on the site: its Backups box says what to check."
              failed=1 ;;
          esac
          case "$backups" in
            stale|missing)
              echo "::error title=Server backup stopped::The server has no backup from the last 36 hours (backups: $backups). See docs/MONITORING.md."
              failed=1 ;;
          esac
          exit $failed
